# i8kmon fan curve - Dell 15 DC15250 (board 0WM2ND)
# Single fan. Goal: maximum cooling, noise not a concern.
# Fan states: 0 = off, 1 = low, 2 = high (5800 RPM max)
#
# IMPORTANT: i8kmon lreverses the {fan_speeds} pair internally for
# backwards compatibility. So {1 2} is stored as {2 1}, meaning fan 1
# receives state 2. Only the FIRST element matters on a single-fan laptop.
#   {1 1} -> fan1 = 1 (low)      {1 2} -> fan1 = 2 (high)
#
# Format: {fan_speeds} low_ac high_ac low_batt high_batt
# State selection is discrete with hysteresis, NOT interpolated.

# Status check timeout (seconds)
set config(timeout)     2

# Only update fan speed when thresholds are exceeded
set config(ondemand)    0

# Average temperature over last n samples
set config(average)     1

# hwmon chip used for temperature readings
set config(chip_name)   "dell_smm"

# Index of the hwmon temperature sensor (1 = CPU)
set config(temp_sensor) 1

# Number of temperature configurations
set config(num_configs) 5

# Fan runs low only below 40C, flat out from 45C upward.
# Battery thresholds are slightly higher to save power unplugged.
set config(0)   {{1 1}  -1  45  -1  45}
set config(1)   {{2 2}  40  55  40  55}
set config(2)   {{2 2}  50  70  50  70}
set config(3)   {{2 2}  65  90  65  90}
set config(4)   {{2 2}  90 128  90 128}

# NOTE: the Arch package ships these two lines, and they are absent here on
# purpose. They are leftovers from the old Debian i8kmon and are ignored by
# i8kutils 1.60:
#
#   set config(user)  person
#   set config(admin)  person
#
# i8kmon 1.60 contains zero references to config(user) or config(admin), and
# its built-in default array does not define them either. Adding them has no
# effect. Verify with:
#   strings /usr/bin/i8kmon | grep -cE "config\(user\)|config\(admin\)"   # -> 0
#
# 1.60 also hardcodes its config path, so ~/.i8kmon is not read any more.
# /etc/i8kutils/i8kmon.conf is the only file that matters.
